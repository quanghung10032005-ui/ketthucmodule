<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        
        let n=parseInt(prompt("nhập 1 số nguyên dương"));
        do{
            if(n<=0){
                n=parseInt(prompt("số phải là số nguyên dương. Vui lòng nhập lại."));
            }
        }while (n<=0);
        function sohoanhao(n){
            let sum=0;
            for(let i=1;i<n;i++){
                if(n%i==0){
                    sum+=i;
                }
            }
            if(sum==n){
                return true;
            }
            else{
                return false;
            }
        }
        if(sohoanhao(n)){
            document.write(n+" là số hoàn hảo.");
        }
        else{
            document.write(n+" không phải là số hoàn hảo.");
        }
    </script>
</body>
</html>
