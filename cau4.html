<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="Congnhan.js"></script>
</head>
<style>
    #title{
        text-align: center;
        margin-top: 20px;
    }
    table{
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
    }
    th,td{
        padding: 10px;
        text-align: left;
    }
    th{
        background-color: #f2f2f2;
    }
    #table{
        width: 60%;
        margin: 0 auto;
    }
    #title{
        font-size: 24px;
        font-weight: bold;
        justify-content: center;
        display: flex;
    }
</style>
<body>
    <div id="title">
        <h1>Quản lí công nhân</h1>
    </div>
    <div id="table">
    <table border="1">
        <thead>
        <tr>
            <th>STT</th>
            <th>Họ tên</th>
            <th>Ngày sinh</th>
            <th>Địa chỉ</th>
            <th>Lương</th>
            <th>Chức vụ</th>
        </tr>
        </thead>
        <tbody id="table-body">
        </tbody>
    </table>
    </div>
    <script>
        let tableBody=document.getElementById("table-body");
        let workers=[];
        let data1=new Congnhan(1,"Trương Tấn A","11-11-1997","Quảng Nam",2000,"Abc");
        let data2=new Congnhan(2,"Trương Tấn B","11-11-1998","Đà Nẵng",2000,"Abc");
        let data3=new Congnhan(3,"Trương Tấn C","11-11-1999","Huế",2000,"Abc");
        workers.push(data2);
        workers.push(data3);
        workers.push(data1);
        function hienthi(){
            let str="";
            for(let i=0;i<workers.length;i++){
                str+=`<tr>
                    <td>${workers[i].stt}</td>
                    <td>${workers[i].name}</td>
                    <td>${workers[i].date}</td>
                    <td>${workers[i].address}</td>
                    <td>${workers[i].luong}</td>
                    <td>${workers[i].chucvu}</td>`
            }
            tableBody.innerHTML=str;
        }
    function sapxep(worker){
        workers.sort((a,b)=>{
            if(a.name < b.name) return -1;
            if(a.name > b.name) return 1;
            return 0;
        });
    }
    sapxep(workers);
    hienthi();
    </script>
</body>
</html>
